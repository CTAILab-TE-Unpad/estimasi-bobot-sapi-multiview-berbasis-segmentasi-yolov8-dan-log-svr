services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cattle-weight-api:dev
    container_name: cattle-weight-api
    ports:
      - "8000:8000"
    volumes:
      # Mount models directory for easy model swapping during development.
      # Remove this volume in production — bake models into the image instead.
      - ./models:/app/models:ro
    env_file:
      - .env
    environment:
      CATTLE_LOG_LEVEL: DEBUG
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Allow time for YOLO model loading

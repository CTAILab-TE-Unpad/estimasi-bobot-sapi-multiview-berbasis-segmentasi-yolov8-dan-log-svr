services:
  cattle-api:
    image: ${CATTLE_IMAGE:-cattle-weight-api:latest}
    container_name: cattle-api
    restart: unless-stopped
    ports:
      - "${CATTLE_PORT:-4001}:4001"
    deploy:
      resources:
        limits:
          memory: 1.4g
        reservations:
          memory: 800m

    environment:
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-2}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4001/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
